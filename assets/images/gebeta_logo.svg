<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradients -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c00" />
      <stop offset="100%" stop-color="#ff5a5f" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71" />
      <stop offset="100%" stop-color="#27ae60" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Platter (Gebeta) Outer Rim -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#orangeGrad)" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Platter Inner Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#greenGrad)" stroke-width="2" stroke-dasharray="4 3" filter="url(#shadow)" />

  <!-- Stylized Cloche / Food Dome Cover -->
  <path d="M 28,50 A 22,22 0 0,1 72,50 Z" fill="url(#orangeGrad)" opacity="0.9" />
  
  <!-- Steam lines rising -->
  <path d="M 45,22 Q 43,17 46,14" fill="none" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 50,20 Q 48,15 51,12" fill="none" stroke="#ff8c00" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 55,22 Q 53,17 56,14" fill="none" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round" />

  <!-- Base platter plate line -->
  <path d="M 24,54 L 76,54" stroke="url(#greenGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 32,59 L 68,59" stroke="url(#orangeGrad)" stroke-width="3" stroke-linecap="round" />
</svg>
